<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking {{ channel }} display</title>
<style>
  :root { color-scheme: light dark; --fg:#111; --bg:#fff; --muted:#777; --line:#e5e5e5; --bad:#b00020; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f2; --bg:#111; --muted:#999; --line:#2a2a2a; --bad:#ff6b81; } }
  body { font-family: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--fg);
         margin:0; padding:32px 20px; display:flex; justify-content:center; }
  main { width:100%; max-width:420px; text-align:center; }
  h1 { font-size:15px; font-weight:500; color:var(--muted); margin:0 0 24px; }
  .big { font-size:56px; font-weight:600; margin:8px 0; }
  .muted { color:var(--muted); font-size:14px; }
  .plate { font-size:22px; font-weight:600; letter-spacing:1px; }
  img { width:240px; height:240px; image-rendering:pixelated; margin:16px auto; display:block; background:#fff; padding:8px; }
  .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:15px; }
  #conn { margin-top:24px; font-size:12px; color:var(--muted); } #conn.bad { color:var(--bad); }
  .banner { background:#fff3cd; color:#664d03; border-radius:4px; padding:6px 10px; font-size:13px; margin-bottom:16px; }
</style>
</head>
<body>
<main>
  <h1>{{ "Entrance" if channel == "entry" else "Exit" }}</h1>
  <div id="view"><div class="muted">Connecting…</div></div>
  <div id="conn">connecting</div>
</main>
<script>
const CHANNEL = "{{ channel }}";
const view = document.getElementById("view"), conn = document.getElementById("conn");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(msg) {
  if (msg.event === "entry_display_update") {
    view.innerHTML = `<div class="big">${esc(msg.free_slots)} / ${esc(msg.total_slots)}</div>
      <div class="muted">free spaces</div>` +
      (msg.tariff ? `<div class="row"><span>Tariff</span><span>${esc(msg.tariff.price_per_minute)} / min, first ${esc(msg.tariff.free_minutes)} min free</span></div>` : "");
  } else if (msg.event === "exit_bill") {
    const d = msg.duration;
    view.innerHTML = (msg.payment_simulated ? `<div class="banner">TEST MODE: simulated payment, no real money</div>` : "") +
      `<div class="plate">${esc(msg.plate_number)}</div>
       <div class="row"><span>Time</span><span>${d.hours}h ${d.minutes}m ${d.seconds}s</span></div>
       <div class="big">${Number(msg.amount_due).toFixed(2)} <span class="muted">${esc(msg.currency || "")}</span></div>
       <img alt="Payment QR" src="${esc(msg.qr_code_base64)}">
       <div class="muted">Scan to pay. The barrier opens after the payment is verified.</div>`;
  } else if (msg.event === "exit_clear") {
    view.innerHTML = `<div class="muted">Exit is clear. Waiting for the next vehicle.</div>`;
  }
}

function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/" + CHANNEL + "-display");
  ws.onopen = () => { conn.textContent = "live"; conn.className = ""; };
  ws.onmessage = e => { try { render(JSON.parse(e.data)); } catch (_) {} };
  ws.onclose = () => { conn.textContent = "disconnected, retrying…"; conn.className = "bad"; setTimeout(connect, 2000); };
}
connect();
</script>
</body>
</html>
